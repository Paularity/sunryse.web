<style>
body{margin:0}
a{color:#0B1F4D;text-decoration:none}
.mono{font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.12em}
.sun-text{background:linear-gradient(135deg,#FFB21A,#FF7A00 45%,#FF4D1A);-webkit-background-clip:text;background-clip:text;color:transparent}
.sky-text{background:linear-gradient(135deg,#3B8BFF,#1546C7);-webkit-background-clip:text;background-clip:text;color:transparent}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.row{display:flex;justify-content:space-between;align-items:center;min-height:56px;border-bottom:1px solid rgba(11,31,77,.1);font-family:'Space Grotesk';font-weight:700;font-size:18px;background:none;border-left:0;border-right:0;border-top:0;width:100%;color:#0B1F4D;padding:0;cursor:pointer}
.m-ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(11,31,77,.14);flex:none}
/* fx-layer:start — SunRyse "daylight futurism" layer. Identical on every board; edit fx/layer.css, not here. */
/* Baseline icon style (zero specificity: a board's own .ico rule wins) */
:where(.ico){width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* Logo lockup (canonical, never restyled) */
.fx-logo{display:flex;align-items:center;gap:10px;min-height:44px;color:#0B1F4D;text-decoration:none;flex:none}
.fx-logo:hover{color:#0B1F4D}
.fx-logo-w{display:flex;flex-direction:column;line-height:1}
.fx-logo-n{font-family:Sora,sans-serif;font-weight:800;font-size:22px;letter-spacing:-.02em}
.fx-logo-t{font-family:'JetBrains Mono',monospace;text-transform:uppercase;font-size:9px;letter-spacing:.3em;margin-top:4px;color:#0B1F4D}
.fx-logo .sun-text{background:linear-gradient(135deg,#FFB21A,#FF7A00 45%,#FF4D1A);-webkit-background-clip:text;background-clip:text;color:transparent}
.fx-logo .sky-text{background:linear-gradient(135deg,#3B8BFF,#1546C7);-webkit-background-clip:text;background-clip:text;color:transparent}
.fx-foot .fx-logo-t{color:#C9D4F2}
.fx-foot .fx-logo .sky-text{background-image:linear-gradient(135deg,#7DB6FF,#3B8BFF)}
/* Buttons (same on every page) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:14px;font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.12em;font-size:12px;font-weight:500;box-sizing:border-box;transition:box-shadow .3s,transform .3s,background .3s}
.btn-sun{background:linear-gradient(135deg,#FFC93C,#FF8A00 50%,#FF5A1F);color:#0B1F4D;box-shadow:0 8px 20px -8px rgba(255,90,31,.7)}
.btn-navy{background:#0B1F4D;color:#FFFFFF}
.btn-navy:hover{color:#FFFFFF;box-shadow:0 12px 28px -10px rgba(30,111,232,.8),inset 0 0 0 1px rgba(111,176,255,.5)}
.btn-line{background:rgba(255,255,255,.8);color:#0B1F4D;border:1px solid rgba(11,31,77,.18)}
.btn-line:hover{color:#0B1F4D;border-color:#1E6FE8;box-shadow:0 10px 24px -14px rgba(30,111,232,.7)}
.btn-sun,.fx-sheen{position:relative;overflow:hidden;isolation:isolate}
.btn-sun::after,.fx-sheen::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;z-index:-1;background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-20deg);animation:fx-sheen 5s ease-in-out infinite;pointer-events:none}
.btn-sun:hover,.fx-sheen:hover{color:#0B1F4D;box-shadow:0 14px 30px -10px rgba(255,90,31,.85)}
/* Header (same on every page; active link uses aria-current) */
.fx-hdr>.wrap,.fx-foot>.wrap{max-width:1320px;margin:0 auto;padding:0 40px;box-sizing:border-box}
@media (max-width:640px){.fx-hdr>.wrap,.fx-foot>.wrap{padding:0 16px}}
.fx-hdr{position:relative;z-index:6;padding-top:16px;text-align:left}
.fx-hdr .glass{display:flex;align-items:center;justify-content:space-between;gap:16px;height:68px;border-radius:20px;padding:0 10px 0 16px}
.fx-hdr .navlinks{display:flex;gap:4px;font-size:12px}
.fx-hdr .navlinks a{position:relative;display:inline-flex;align-items:center;min-height:44px;padding:0 12px;border-radius:10px;color:#0B1F4D;transition:background .2s,color .2s}
.fx-hdr .navlinks a:hover{background:rgba(30,111,232,.08);color:#0B1F4D}
.fx-hdr .navlinks a[aria-current]{color:#C2410C;background:rgba(255,138,0,.10)}
.fx-hdr .navlinks a[aria-current]::after{content:"";position:absolute;left:12px;right:12px;bottom:6px;height:2px;border-radius:2px;background:linear-gradient(90deg,#FFC93C,#FF5A1F);box-shadow:0 0 10px rgba(255,138,0,.8)}
.fx-hdr .burger{display:none;width:48px;height:48px;border-radius:14px;background:#0B1F4D;place-items:center;color:#FFFFFF}
@media (max-width:1023px){.fx-hdr .navlinks,.fx-hdr .hdr-call{display:none}.fx-hdr .burger{display:grid}}
@media (max-width:640px){.fx-hdr .hdr-quote{display:none !important}.fx-hdr .glass{height:62px;padding:0 8px 0 12px}}
/* Glass + cards */
.glass{background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.95);box-shadow:inset 0 1px 0 #FFFFFF,0 20px 50px -22px rgba(11,31,77,.38);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3)}
.card{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(255,255,255,.84));border:1px solid rgba(11,31,77,.09);box-shadow:inset 0 1px 0 #FFFFFF,0 1px 2px rgba(11,31,77,.04),0 18px 40px -22px rgba(11,31,77,.30)}
a.card,.fx-lift{transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s}
a.card:hover,.fx-lift:hover{transform:translateY(-3px);box-shadow:inset 0 1px 0 #FFFFFF,0 28px 54px -26px rgba(11,31,77,.45)}
a.card::after,.fx-ring::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;pointer-events:none;background:linear-gradient(135deg,#FFC93C,rgba(255,90,31,.4) 35%,rgba(30,111,232,.3) 65%,#4A93FF);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:opacity .35s}
a.card:hover::after,.fx-ring:hover::after,.fx-ring.on::after{opacity:1}
.fx-ring{position:relative}
/* Section eyebrow with live dot */
.eyebrow,.eb,.fx-eb{display:inline-flex;align-items:center;gap:10px}
.eyebrow::before,.eb::before,.fx-eb::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none;animation:fx-ping 2.4s ease-out infinite}
/* Highlighted headline word (glowing frame) */
.hl{display:inline-block;margin:0 2px;border-radius:16px;box-shadow:0 0 0 2px #1E6FE8,0 14px 34px -14px rgba(30,111,232,.75);background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(234,242,255,.75))}
.hl-sun{box-shadow:0 0 0 2px #FF8A00,0 16px 40px -14px rgba(255,138,0,.85)}
/* Blueprint grid (light sections) */
.gl,.fx-grid{background-image:radial-gradient(rgba(11,31,77,.11) 1px,transparent 1.4px),repeating-linear-gradient(90deg,rgba(11,31,77,.05) 0 1px,transparent 1px 220px);background-size:22px 22px,auto}
/* Page-hero blueprint grid (behind content) */
section[data-pt]{isolation:isolate}
.fx-hero-grid{position:absolute;left:0;right:0;top:0;height:100%;max-height:900px;z-index:-1;pointer-events:none;background-image:radial-gradient(rgba(11,31,77,.13) 1px,transparent 1.4px),repeating-linear-gradient(90deg,rgba(11,31,77,.05) 0 1px,transparent 1px 220px);background-size:22px 22px,auto;-webkit-mask-image:radial-gradient(90% 75% at 50% 20%,#000,transparent 80%);mask-image:radial-gradient(90% 75% at 50% 20%,#000,transparent 80%)}
/* Dark accent band (Services, Impact, inner CTA bands) */
.fx-dark{position:relative;overflow:hidden;isolation:isolate;background:#071433 !important;color:#FFFFFF}
.fx-dark::before{content:"";position:absolute;inset:0;z-index:-2;background:radial-gradient(55% 60% at 88% 0%,rgba(255,138,0,.32),transparent 70%),radial-gradient(45% 55% at 0% 100%,rgba(30,111,232,.40),transparent 70%)}
.fx-dark::after{content:"";position:absolute;left:-20%;right:-20%;bottom:0;height:70%;z-index:-1;background-image:linear-gradient(rgba(120,170,255,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(120,170,255,.16) 1px,transparent 1px);background-size:64px 64px;transform:perspective(700px) rotateX(60deg);transform-origin:bottom;-webkit-mask-image:linear-gradient(to top,#000,transparent 90%);mask-image:linear-gradient(to top,#000,transparent 90%)}
/* Dark "screen" panel inside light sections (charts, spec sheets) */
.fx-screen{position:relative;overflow:hidden;background:radial-gradient(90% 70% at 100% 0%,rgba(255,138,0,.22),transparent 60%),radial-gradient(70% 60% at 0% 100%,rgba(30,111,232,.30),transparent 60%),#0A1838;color:#FFFFFF;border:1px solid rgba(255,255,255,.10);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 30px 60px -30px rgba(7,20,51,.7)}
.fx-screen::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(120,170,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(120,170,255,.08) 1px,transparent 1px);background-size:32px 32px}
.fx-screen>*{position:relative}
/* HUD chip */
.fx-hud{display:inline-flex;align-items:center;gap:8px;font:500 11px/1.2 'JetBrains Mono',monospace;letter-spacing:.12em;text-transform:uppercase;padding:8px 12px;border-radius:999px;background:rgba(7,20,51,.74);color:#E6EEFF;border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);white-space:nowrap}
.fx-hud.light{background:rgba(255,255,255,.78);color:#0B1F4D;border-color:rgba(255,255,255,.95)}
.fx-dot{width:7px;height:7px;border-radius:50%;background:#5BD97A;box-shadow:0 0 10px #5BD97A;flex:none;animation:fx-blink 1.8s ease-in-out infinite}
.fx-dot.amber{background:#FF8A00;box-shadow:0 0 10px #FF8A00}
/* Image scan line (photos in bracket frames) */
.corners{position:relative}
.fx-scan{position:absolute;inset:8px;border-radius:14px;overflow:hidden;pointer-events:none;z-index:1}
.fx-scan::before{content:"";position:absolute;left:0;right:0;height:34%;top:-34%;background:linear-gradient(180deg,transparent,rgba(255,201,60,.10) 70%,rgba(255,201,60,.7));animation:fx-scan 5s cubic-bezier(.5,0,.5,1) infinite}
.fx-scan::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px,transparent 1px 4px)}
/* Footer */
.fx-foot{position:relative;overflow:hidden;background:#071433;color:#FFFFFF;padding:64px 0 28px}
.fx-foot::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,transparent,#FF8A00 30%,#4A93FF 70%,transparent);box-shadow:0 0 18px rgba(255,138,0,.7)}
.fx-foot::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(50% 80% at 100% 0%,rgba(255,138,0,.14),transparent 70%),radial-gradient(40% 70% at 0% 100%,rgba(30,111,232,.18),transparent 70%)}
.fx-foot>*{position:relative;z-index:1}
.fx-foot-grid{display:grid;grid-template-columns:1.3fr repeat(3,minmax(0,1fr));gap:32px}
.fx-foot nav a,.fx-foot .fx-flink{color:#E3E9F7;min-height:44px;display:flex;align-items:center}
.fx-foot nav a:hover{color:#FFC93C}
.fx-soc{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#FFFFFF;transition:background .3s,box-shadow .3s}
.fx-soc:hover{color:#0B1F4D;background:linear-gradient(135deg,#FFC93C,#FF8A00 50%,#FF5A1F);box-shadow:0 8px 24px -8px rgba(255,138,0,.9)}
@media (max-width:1023px){.fx-foot-grid{grid-template-columns:1fr 1fr}.fx-foot{padding-bottom:110px}}
@media (max-width:640px){.fx-foot-desc{display:none}.fx-foot{padding-top:48px}.fx-foot-grid{grid-template-columns:1fr 1fr;gap:20px 16px}.fx-foot-grid>:first-child,.fx-foot-grid>:last-child{grid-column:1/-1}.fx-foot-grid>:last-child{flex-direction:row !important;flex-wrap:wrap;align-items:center;column-gap:18px !important}.fx-foot-grid>:last-child>.mono{flex-basis:100%}}
/* Motion */
@keyframes fx-ping{0%{box-shadow:0 0 0 0 rgba(255,138,0,.55)}70%{box-shadow:0 0 0 8px rgba(255,138,0,0)}100%{box-shadow:0 0 0 0 rgba(255,138,0,0)}}
@keyframes fx-blink{50%{opacity:.35}}
@keyframes fx-scan{0%{top:-34%}100%{top:100%}}
@keyframes fx-sheen{0%,60%{left:-60%}100%{left:130%}}
@keyframes fx-spin{to{transform:rotate(360deg)}}
@keyframes fx-flow{to{stroke-dashoffset:-24}}
@media (prefers-reduced-motion:reduce){.eyebrow::before,.eb::before,.fx-eb::before,.fx-dot,.fx-scan::before,.btn-sun::after,.fx-sheen::after,.fx-spin,.fx-flowline{animation:none !important}.fx-scan{display:none}a.card,.fx-lift,.btn{transition:none}}
/* fx-layer:end */
</style>
</helmet>
